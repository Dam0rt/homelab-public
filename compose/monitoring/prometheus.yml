global:
  scrape_interval: 15s       # Fréquence de collecte des métriques
  evaluation_interval: 15s

scrape_configs:
  # Prometheus se surveille lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Sonde physique de l'hôte helium
  - job_name: 'helium-host'
    static_configs:
      - targets: ['node-exporter:9100']

  # Hôte Unraid (titanium) : remplace par l'IP/nom de ton hôte
  - job_name: 'unraid-server'
    static_configs:
      - targets: ['unraid-host:9100']

  # Hôte Proxmox (uranium) via l'exporter PVE : remplace par tes hôtes
  - job_name: 'proxmox-server'
    metrics_path: /pve
    static_configs:
      - targets:
          - proxmox-host
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter-host:9221

  # Métriques UniFi via Unpoller
  - job_name: 'unpoller'
    static_configs:
      - targets: ['unpoller:9130']   # 'unpoller' = nom du service Docker
