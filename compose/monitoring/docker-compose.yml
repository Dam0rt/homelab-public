services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'  # 30 jours d'historique pour soulager le NVMe

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    # Pas de port exposé : seul Prometheus y accède via le réseau Docker interne

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - ./loki-data:/loki/data
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    depends_on:
      - loki
    ports:
      # 1514 TCP+UDP : réception du Syslog (ex. UDM / UniFi)
      - "1514:1514/tcp"
      - "1514:1514/udp"
      - "9080:9080"   # GUI Promtail
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yml
      # Logs de l'hôte, en lecture seule
      - /var/log:/var/log:ro
      # Logs des autres conteneurs
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    command: -config.file=/etc/promtail/config.yml

  unpoller:
    image: ghcr.io/unpoller/unpoller:latest
    container_name: unpoller
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - UP_INFLUXDB_DISABLE=true
      - UP_PROMETHEUS_HTTP_LISTEN=0.0.0.0:9130
      - UP_UNIFI_CONTROLLER_0_URL=${UNPOLLER_URL}    # URL du contrôleur (UDM)
      - UP_UNIFI_CONTROLLER_0_USER=${UNPOLLER_USER}  # utilisateur READ-ONLY créé sur l'UDM
      - UP_UNIFI_CONTROLLER_0_PASS=${UNPOLLER_PASS}  # mot de passe de cet utilisateur
      - UP_UNIFI_CONTROLLER_0_SAVE_SITES=true
      - UP_UNIFI_CONTROLLER_0_SAVE_DPI=true
    ports:
      - "9130:9130"
